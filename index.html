(()=>{const K='toquin-v1',A=['Cocina principal','Cocina domicilios','Mesas','Varios','Domicilios','Jugos'],seed=[['Barahona',0],['Angelo',0],['Sepúlveda',0],['Ludy',0],['Carlos Mario',0],['Haillerth',0],['Maikel',0],['Johan',0],['Sebastian',0],['Doraine',0],['Anderson',2],['Maribella',2],['Santiago',2],['Nicolas',2],['Tachu',3],['Pablo',3],['Jaider',4],['Melany',5]],id=()=>Math.random().toString(36).slice(2,9),iso=d=>new Date(d).toISOString().slice(0,10),plus=(d,n)=>{let x=new Date(d);x.setDate(x.getDate()+n);return x},fmt=d=>new Date(d+'T12:00').toLocaleDateString('es-CO',{day:'numeric',month:'short'}),day=d=>new Date(d+'T12:00').toLocaleDateString('es-CO',{weekday:'short'}),cash=n=>new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(n||0),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let S;try{S=JSON.parse(localStorage.getItem(K))}catch{}if(!S)S={people:seed.map(x=>({id:id(),n:x[0],a:x[1]})),rates:{},schedules:[],closes:[],list:[]};S.payRates=S.payRates||{};S.fixedPay=S.fixedPay||{};S.rateOverrides=S.rateOverrides||{};S.people.forEach(p=>{if(!p.role)p.role=inferRole(p)});let who='',page='schedule',sid=null;const root=document.getElementById('root'),save=()=>{localStorage.setItem(K,JSON.stringify(S));document.getElementById('save').textContent='● Guardado en este celular';window.dispatchEvent(new CustomEvent('toquin-state-changed',{detail:S}))},toast=t=>{document.getElementById('save').textContent=t;setTimeout(()=>document.getElementById('save').textContent='● Guardado en este celular',1800)},active=()=>S.schedules.find(x=>x.id===sid)||S.schedules[0];
function nav(){let ps=who==='camila'?['schedule','payroll','close','history']:['shopping'],names={schedule:'Horario',payroll:'Nómina',close:'Cierre',history:'Historial',shopping:'Compras'};return '<div class="row">'+(window.TOQUIN_ACCOUNT_BAR?window.TOQUIN_ACCOUNT_BAR():'<span class="muted">PERFIL '+who.toUpperCase()+'</span><button class="btn secondary" onclick="home()">← Volver</button>')+'</div><div class="tabs">'+ps.map(p=>'<button class="tab '+(p===page?'active':'')+'" onclick="go(\''+p+'\')">'+names[p]+'</button>').join('')+(who==='camila'&&window.TOQUIN_RECIPES?'<button class="tab" onclick="TOQUIN_RECIPES.open()">Recetas</button><button class="tab" onclick="TOQUIN_RECIPES.openMP()">MP</button>':'')+(window.TOQUIN_PRODUCTION?.tab?.()||'')+'</div>'}
function home(){who='';root.innerHTML='<h1>Bienvenidos, toquijefes.</h1><p class="muted">¿Quién está usando TOQUIN APP?</p><div class="grid"><button class="profile" onclick="enter(\'camila\')">👩🏻‍🍳<b>Soy Camila</b><span class="muted">Horario · Nómina · Cierres</span></button><button class="profile" onclick="enter(\'luisda\')">🛒<b>Soy Luisda</b><span class="muted">Lista de compras</span></button></div><div class="panel hint">Modo local activo. Los datos se guardan en este dispositivo. La sincronización entre celulares se activará al conectar Supabase.</div>'}

function schedule(){let s=active();if(!s)return '<h1>Horario quincenal</h1><div class="panel grid"><label>Desde<input id="start" type="date" value="'+iso(new Date())+'"></label><label>Hasta<input id="end" type="date" value="'+iso(plus(new Date(),13))+'"></label><button class="btn" onclick="createSchedule()">Crear horario</button></div>'+S.schedules.map(x=>'<div class="panel row"><b>'+fmt(x.start)+' – '+fmt(x.end)+'</b><button class="btn secondary" onclick="openSchedule(\''+x.id+'\')">Abrir</button></div>').join('');let h='<h1>Horario del equipo</h1><div class="panel grid"><label>Desde<input id="eStart" type="date" value="'+s.start+'"></label><label>Hasta<input id="eEnd" type="date" value="'+s.end+'"></label><button class="btn secondary" onclick="editDates()">Cambiar fechas</button></div><div class="row"><button class="btn secondary" onclick="addPerson()">+ Persona</button><button class="btn secondary" onclick="copyPrompt()">Copiar mensaje para imagen</button><button class="btn secondary" onclick="document.getElementById(\'equipo\').scrollIntoView({behavior:\'smooth\'})">👥 Trabajadores</button><button class="btn" onclick="toast(\'Horario guardado\')">Terminar horario</button></div><div class="scroll panel"><table class="schedule"><tr><th>Equipo</th>'+s.days.map(d=>'<th>'+day(d)+'<br>'+fmt(d)+'</th>').join('')+'</tr>';A.forEach((a,i)=>{const dom=i===1,T=dom?(s.turnsDom||{}):s.turns,grp=(i===0||i===1)?S.people.filter(p=>p.a===0||p.a===1):S.people.filter(p=>p.a===i);h+='<tr><td class="day" colspan="'+(s.days.length+1)+'">'+a+'</td></tr>';grp.forEach(p=>{h+='<tr><td>'+esc(p.n)+'</td>'+s.days.map(d=>'<td><input type="checkbox" '+(T[p.id]?.[d]?'checked':'')+' onchange="turn(\''+p.id+'\',\''+d+'\',this.checked,'+(dom?1:0)+')"></td>').join('')+'</tr>'})});h+='</table></div><div class="panel"><h2>Días festivos</h2><p class="hint">Marca los festivos. Para cocineros, el festivo paga $40.000; sábado y domingo mantienen $45.000.</p>'+s.days.map(d=>'<label class="item"><input type="checkbox" '+(s.holidays?.[d]?'checked':'')+' onchange="holiday(\''+d+'\',this.checked)"><span>'+fmt(d)+' · '+day(d)+' — Festivo</span></label>').join('')+'</div><h2>Cena del equipo</h2><div class="grid">'+s.days.map(d=>'<label class="panel">'+day(d)+' '+fmt(d)+'<input placeholder="Cena del día" value="'+esc(s.dinner[d]||'')+'" onchange="dinner(\''+d+'\',this.value)"></label>').join('')+'</div><div class="panel" id="equipo"><h2>Trabajadores y áreas</h2><p class="hint">Cambia el área o toca × para eliminar a un trabajador.</p>';S.people.forEach(p=>{h+='<div class="row"><span>'+esc(p.n)+'</span><select onchange="move(\''+p.id+'\',this.value)">'+A.map((a,i)=>'<option value="'+i+'" '+(p.a===i?'selected':'')+'>'+a+'</option>').join('')+'</select><button class="btn danger" onclick="removeP(\''+p.id+'\')">×</button></div>'});return h+'</div>'}
window.createSchedule=()=>{let a=document.getElementById('start').value,b=document.getElementById('end').value;if(b<a)return toast('Revisa las fechas');let days=[];for(let d=new Date(a+'T12:00');d<=new Date(b+'T12:00')&&days.length<16;d=plus(d,1))days.push(iso(d));let s={id:id(),start:a,end:b,days,turns:{},dinner:{},holidays:{}};S.schedules.unshift(s);sid=s.id;save();render()};window.openSchedule=x=>{sid=x;render()};window.turn=(p,d,v,dom)=>{let s=active(),T=dom?(s.turnsDom||={}):s.turns;T[p]||={};T[p][d]=v;save()};window.dinner=(d,v)=>{active().dinner[d]=v;save()};window.holiday=(d,v)=>{active().holidays||={};active().holidays[d]=v;save();render()};window.addPerson=()=>{let n=prompt('Nombre de la persona');if(!n)return;let a=prompt('Área 1 Cocina principal, 2 Cocina domicilios, 3 Mesas, 4 Varios, 5 Domicilios, 6 Jugos','1');if(!a||a<1||a>6)return;S.people.push({id:id(),n,a:Number(a)-1});save();render()};window.move=(p,a)=>{S.people.find(x=>x.id===p).a=Number(a);save();render()};window.removeP=p=>{let x=S.people.find(y=>y.id===p);if(!x||!confirm('¿Eliminar a '+x.n+' del equipo? Sus turnos de este horario también se borran.'))return;S.people=S.people.filter(y=>y.id!==p);S.schedules.forEach(s=>{delete s.turns?.[p];delete s.turnsDom?.[p];delete s.discounts?.[p]});delete S.rateOverrides?.[p];save();render();toast(x.n+' eliminado')};window.editDates=()=>{let s=active(),a=document.getElementById('eStart').value,b=document.getElementById('eEnd').value;if(!a||!b||b<a)return toast('Revisa las fechas');let days=[];for(let d=new Date(a+'T12:00');d<=new Date(b+'T12:00')&&days.length<16;d=plus(d,1))days.push(iso(d));if(days.length===16&&days[15]<b)toast('Máximo 16 días');s.start=a;s.end=days[days.length-1];s.days=days;S.closes.filter(c=>c.sid===s.id).forEach(c=>{c.start=s.start;c.end=s.end});save();render();toast('Fechas actualizadas')};window.addDisc=p=>{let s=active(),c=prompt('Concepto del descuento (ej: adelanto, consumo, faltante)');if(c===null)return;let v=Number(String(prompt('Valor del descuento','')||'').replace(/[^0-9]/g,''));if(!v)return toast('Valor inválido');s.discounts||={};(s.discounts[p]||=[]).push({c:c.trim()||'Descuento',v});save();render()};window.delDisc=(p,i)=>{let s=active();s.discounts?.[p]?.splice(i,1);save();render()};window.copyPrompt=()=>{let s=active(),d=s.days.map(x=>({fecha:x,cena:s.dinner[x]||'',areas:A.map((a,i)=>({area:a,nombres:S.people.filter(p=>i===1?((p.a===0||p.a===1)&&s.turnsDom?.[p.id]?.[x]):i===0?((p.a===0||p.a===1)&&s.turns[p.id]?.[x]):(p.a===i&&s.turns[p.id]?.[x])).map(p=>p.n)})).filter(x=>x.nombres.length)}));let t='Diseña una imagen del Horario del equipo TOQUÍN con logo oficial adjunto, una columna por día, tarjetas por área con icono y nombres, y cena diaria. Colores naranja, crema y café oscuro. Rango '+s.start+' a '+s.end+'. Datos: '+JSON.stringify(d);navigator.clipboard.writeText(t).then(()=>toast('Mensaje copiado')).catch(()=>prompt('Copia el mensaje',t))};
const DEFAULT_RATES={cocinero:{weekday:35000,fridayHoliday:40000,weekend:45000},mesero:{weekday:30000,fridayHoliday:35000,weekend:35000},domiciliario:{weekday:30000,weekend:40000},barista:{all:25000},stiwar:{all:40000},cajero:{all:40000},produccion:{all:40000}};
const ROLE_OPTIONS=[['cocinero','Cocinero'],['mesero','Mesero'],['domiciliario','Domiciliario'],['barista','Barista'],['cajero','Cajero'],['produccion','Producción']];
function inferRole(p){let n=(p.n||'').trim().toLowerCase();if(n==='tachu')return 'cajero';if(n==='sepúlveda'||n==='sepulveda')return 'produccion';if(n==='pablo')return 'mesero';if(p.a===0||p.a===1)return 'cocinero';if(p.a===2)return 'mesero';if(p.a===4)return 'domiciliario';if(p.a===5)return 'barista';return 'mesero'}
function rateFor(p,d){if(S.rateOverrides?.[p.id]!=null)return Number(S.rateOverrides[p.id])||0;let n=(p.n||'').trim().toLowerCase(),dow=new Date(d+'T12:00').getDay(),weekend=dow===0||dow===6,friday=dow===5,holiday=!!active().holidays?.[d];if(n==='tachu')return 0;if(n==='pablo')return weekend?Number(S.payRates?.pabloWeekend??40000):roleRate('mesero',weekend,friday,holiday);let role=p.role||inferRole(p);if(n==='sepúlveda'||n==='sepulveda'||role==='produccion')return roleRate('cocinero',weekend,friday,holiday);return roleRate(role,weekend,friday,holiday)}
function roleRate(role,weekend,friday,holiday){let r=S.payRates?.[role]||DEFAULT_RATES[role]||{};if(role==='cocinero'){if(weekend)return Number(r.weekend??45000);if(friday||holiday)return Number(r.fridayHoliday??40000);return Number(r.weekday??35000)}if(role==='mesero')return weekend||friday?Number(r.fridayHoliday??35000):Number(r.weekday??30000);if(role==='domiciliario')return weekend?Number(r.weekend??40000):Number(r.weekday??30000);return Number(r.all??0)}
