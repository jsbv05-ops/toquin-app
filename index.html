<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f47721"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg"><title>TOQUIN APP</title><style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap');:root{--o:#f47721;--c:#fff3df;--p:#fffaf1;--b:#39251c;--m:#907b6d;--l:#ead9c6;--g:#387b52}*{box-sizing:border-box}body{margin:0;background:var(--c);color:var(--b);font-family:Nunito,sans-serif}.app{max-width:1000px;margin:auto;padding:14px;min-height:100vh}header,.row{display:flex;align-items:center;justify-content:space-between;gap:9px;flex-wrap:wrap}header{padding:8px 0 18px}.brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:1000}.brand img{width:44px;height:44px;background:#000;border-radius:12px}.muted,.hint{color:var(--m);font-size:12px;font-weight:800}h1{font-size:30px;margin:8px 0}h2{font-size:19px;margin:0 0 10px}.panel{background:var(--p);border:1px solid var(--l);border-radius:18px;padding:15px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.btn,.tab{border:0;border-radius:12px;padding:10px 14px;background:var(--o);color:white;font-weight:900;cursor:pointer}.secondary{background:#f5e5d3;color:var(--b)}.danger{background:#fff0ed;color:#a43b30}.profile{background:var(--p);border:2px solid var(--l);border-radius:18px;padding:22px;text-align:left;color:var(--b);font:inherit;cursor:pointer}.profile b{display:block;font-size:22px}.tabs{display:flex;gap:7px;overflow:auto;margin:12px 0}.tab{white-space:nowrap;background:#f5e5d3;color:var(--b)}.tab.active{background:var(--b);color:white}input,select,textarea{font:inherit;border:1px solid var(--l);border-radius:10px;padding:9px;width:100%;min-width:0}textarea{min-height:100px}.field{display:grid;gap:5px;margin:8px 0}.field label{font-size:12px;color:var(--m);font-weight:900}.scroll{overflow:auto}.schedule{border-collapse:collapse;background:white;min-width:100%}.schedule th,.schedule td{padding:7px;border:1px solid var(--l);text-align:center;min-width:64px}.schedule th:first-child,.schedule td:first-child{position:sticky;left:0;background:#fff8ed;text-align:left;min-width:130px}.schedule input{width:18px;height:18px;accent-color:var(--o)}.day{background:#f8ead8;font-weight:1000}.item{display:flex;align-items:center;gap:9px;background:white;border:1px solid var(--l);border-radius:12px;padding:10px;margin:7px 0}.item input{width:20px;height:20px;accent-color:var(--g)}.done span{text-decoration:line-through;color:#998c82}.stat{background:#fff0dc;border-radius:12px;padding:10px}.stat small{display:block;color:var(--m)}.stat b{font-size:20px}@media(max-width:600px){.grid{grid-template-columns:1fr}.app{padding:12px}h1{font-size:27px}}
</style></head><body><div class="app"><header><div class="brand"><img src="./icon.svg">TOQUIN APP</div><span class="muted" id="save">● Guardado en este celular</span></header><main id="root"></main><p class="muted" style="text-align:center">TOQUÍN · Los toquijefes</p></div><script src="./config.js"></script><script>
(()=>{const K='toquin-v1',A=['Cocina principal','Cocina domicilios','Mesas','Varios','Domicilios','Jugos'],seed=[['Barahona',0],['Angelo',0],['Sepúlveda',0],['Ludy',0],['Carlos Mario',0],['Haillerth',0],['Maikel',0],['Johan',0],['Sebastian',0],['Doraine',0],['Anderson',2],['Maribella',2],['Santiago',2],['Nicolas',2],['Tachu',3],['Pablo',3],['Jaider',4],['Melany',5]],id=()=>Math.random().toString(36).slice(2,9),iso=d=>new Date(d).toISOString().slice(0,10),plus=(d,n)=>{let x=new Date(d);x.setDate(x.getDate()+n);return x},fmt=d=>new Date(d+'T12:00').toLocaleDateString('es-CO',{day:'numeric',month:'short'}),day=d=>new Date(d+'T12:00').toLocaleDateString('es-CO',{weekday:'short'}),cash=n=>new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(n||0),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let S;try{S=JSON.parse(localStorage.getItem(K))}catch{}if(!S)S={people:seed.map(x=>({id:id(),n:x[0],a:x[1]})),rates:{},schedules:[],closes:[],list:[]};S.payRates=S.payRates||{};S.fixedPay=S.fixedPay||{};S.rateOverrides=S.rateOverrides||{};S.people.forEach(p=>{if(!p.role)p.role=inferRole(p)});let who='',page='schedule',sid=null;const root=document.getElementById('root'),save=()=>{localStorage.setItem(K,JSON.stringify(S));document.getElementById('save').textContent='● Guardado en este celular'},toast=t=>{document.getElementById('save').textContent=t;setTimeout(()=>document.getElementById('save').textContent='● Guardado en este celular',1800)},active=()=>S.schedules.find(x=>x.id===sid)||S.schedules[0];
function nav(){let ps=who==='camila'?['schedule','payroll','close','history']:['shopping'],names={schedule:'Horario',payroll:'Nómina',close:'Cierre',history:'Historial',shopping:'Compras'};return '<div class="row"><span class="muted">PERFIL '+who.toUpperCase()+'</span><button class="btn secondary" onclick="home()">Cambiar perfil</button></div><div class="tabs">'+ps.map(p=>'<button class="tab '+(p===page?'active':'')+'" onclick="go(\''+p+'\')">'+names[p]+'</button>').join('')+'</div>'}
function home(){who='';root.innerHTML='<h1>Bienvenidos, toquijefes.</h1><p class="muted">¿Quién está usando TOQUIN APP?</p><div class="grid"><button class="profile" onclick="enter(\'camila\')">👩🏻‍🍳<b>Soy Camila</b><span class="muted">Horario · Nómina · Cierres</span></button><button class="profile" onclick="enter(\'luisda\')">🛒<b>Soy Luisda</b><span class="muted">Lista de compras</span></button></div><div class="panel hint">Modo local activo. Los datos se guardan en este dispositivo. La sincronización entre celulares se activará al conectar Supabase.</div>'}
window.home=home;window.enter=w=>{who=w;page=w==='camila'?'schedule':'shopping';render()};window.go=p=>{page=p;render()};
function render(){if(!who)return home();root.innerHTML=nav()+(who==='luisda'?shopping():page==='schedule'?schedule():page==='payroll'?payroll():page==='close'?close():history())}
function schedule(){let s=active();if(!s)return '<h1>Horario quincenal</h1><div class="panel grid"><label>Desde<input id="start" type="date" value="'+iso(new Date())+'"></label><label>Hasta<input id="end" type="date" value="'+iso(plus(new Date(),13))+'"></label><button class="btn" onclick="createSchedule()">Crear horario</button></div>'+S.schedules.map(x=>'<div class="panel row"><b>'+fmt(x.start)+' – '+fmt(x.end)+'</b><button class="btn secondary" onclick="openSchedule(\''+x.id+'\')">Abrir</button></div>').join('');let h='<h1>Horario del equipo</h1><p class="muted">'+fmt(s.start)+' – '+fmt(s.end)+'</p><div class="row"><button class="btn secondary" onclick="addPerson()">+ Persona</button><button class="btn secondary" onclick="copyPrompt()">Copiar mensaje para imagen</button><button class="btn" onclick="toast(\'Horario guardado\')">Terminar horario</button></div><div class="scroll panel"><table class="schedule"><tr><th>Equipo</th>'+s.days.map(d=>'<th>'+day(d)+'<br>'+fmt(d)+'</th>').join('')+'</tr>';A.forEach((a,i)=>{h+='<tr><td class="day" colspan="'+(s.days.length+1)+'">'+a+'</td></tr>';S.people.filter(p=>p.a===i).forEach(p=>{h+='<tr><td>'+esc(p.n)+'</td>'+s.days.map(d=>'<td><input type="checkbox" '+(s.turns[p.id]?.[d]?'checked':'')+' onchange="turn(\''+p.id+'\',\''+d+'\',this.checked)"></td>').join('')+'</tr>'})});h+='</table></div><div class="panel"><h2>Días festivos</h2><p class="hint">Marca los festivos. Para cocineros, el festivo paga $40.000; sábado y domingo mantienen $45.000.</p>'+s.days.map(d=>'<label class="item"><input type="checkbox" '+(s.holidays?.[d]?'checked':'')+' onchange="holiday(\''+d+'\',this.checked)"><span>'+fmt(d)+' · '+day(d)+' — Festivo</span></label>').join('')+'</div><h2>Cena del equipo</h2><div class="grid">'+s.days.map(d=>'<label class="panel">'+day(d)+' '+fmt(d)+'<input placeholder="Cena del día" value="'+esc(s.dinner[d]||'')+'" onchange="dinner(\''+d+'\',this.value)"></label>').join('')+'</div><div class="panel"><h2>Equipo y áreas</h2>';S.people.forEach(p=>{h+='<div class="row"><span>'+esc(p.n)+'</span><select onchange="move(\''+p.id+'\',this.value)">'+A.map((a,i)=>'<option value="'+i+'" '+(p.a===i?'selected':'')+'>'+a+'</option>').join('')+'</select><button class="btn danger" onclick="removeP(\''+p.id+'\')">×</button></div>'});return h+'</div>'}
window.createSchedule=()=>{let a=document.getElementById('start').value,b=document.getElementById('end').value;if(b<a)return toast('Revisa las fechas');let days=[];for(let d=new Date(a+'T12:00');d<=new Date(b+'T12:00')&&days.length<16;d=plus(d,1))days.push(iso(d));let s={id:id(),start:a,end:b,days,turns:{},dinner:{},holidays:{}};S.schedules.unshift(s);sid=s.id;save();render()};window.openSchedule=x=>{sid=x;render()};window.turn=(p,d,v)=>{let s=active();s.turns[p]||={};s.turns[p][d]=v;save()};window.dinner=(d,v)=>{active().dinner[d]=v;save()};window.holiday=(d,v)=>{active().holidays||={};active().holidays[d]=v;save();render()};window.addPerson=()=>{let n=prompt('Nombre de la persona');if(!n)return;let a=prompt('Área 1 Cocina principal, 2 Cocina domicilios, 3 Mesas, 4 Varios, 5 Domicilios, 6 Jugos','1');if(!a||a<1||a>6)return;S.people.push({id:id(),n,a:Number(a)-1});save();render()};window.move=(p,a)=>{S.people.find(x=>x.id===p).a=Number(a);save();render()};window.removeP=p=>{if(confirm('¿Quitar del equipo?')){S.people=S.people.filter(x=>x.id!==p);save();render()}};window.copyPrompt=()=>{let s=active(),d=s.days.map(x=>({fecha:x,cena:s.dinner[x]||'',areas:A.map((a,i)=>({area:a,nombres:S.people.filter(p=>p.a===i&&s.turns[p.id]?.[x]).map(p=>p.n)})).filter(x=>x.nombres.length)}));let t='Diseña una imagen del Horario del equipo TOQUÍN con logo oficial adjunto, una columna por día, tarjetas por área con icono y nombres, y cena diaria. Colores naranja, crema y café oscuro. Rango '+s.start+' a '+s.end+'. Datos: '+JSON.stringify(d);navigator.clipboard.writeText(t).then(()=>toast('Mensaje copiado')).catch(()=>prompt('Copia el mensaje',t))};
const DEFAULT_RATES={cocinero:{weekday:35000,fridayHoliday:40000,weekend:45000},mesero:{weekday:30000,fridayHoliday:35000,weekend:35000},domiciliario:{weekday:30000,weekend:40000},barista:{all:25000},stiwar:{all:40000},cajero:{all:40000},produccion:{all:40000}};
const ROLE_OPTIONS=[['cocinero','Cocinero'],['mesero','Mesero'],['domiciliario','Domiciliario'],['barista','Barista'],['cajero','Cajero'],['produccion','Producción']];
function inferRole(p){let n=(p.n||'').trim().toLowerCase();if(n==='tachu')return 'cajero';if(n==='sepúlveda'||n==='sepulveda')return 'produccion';if(n==='pablo')return 'mesero';if(p.a===0||p.a===1)return 'cocinero';if(p.a===2)return 'mesero';if(p.a===4)return 'domiciliario';if(p.a===5)return 'barista';return 'mesero'}
function rateFor(p,d){if(S.rateOverrides?.[p.id]!=null)return Number(S.rateOverrides[p.id])||0;let n=(p.n||'').trim().toLowerCase(),dow=new Date(d+'T12:00').getDay(),weekend=dow===0||dow===6,friday=dow===5,holiday=!!active().holidays?.[d];if(n==='tachu')return 0;if(n==='pablo')return weekend?Number(S.payRates?.pabloWeekend??40000):roleRate('mesero',weekend,friday,holiday);let role=p.role||inferRole(p);if(n==='sepúlveda'||n==='sepulveda'||role==='produccion')return roleRate('cocinero',weekend,friday,holiday);return roleRate(role,weekend,friday,holiday)}
function roleRate(role,weekend,friday,holiday){let r=S.payRates?.[role]||DEFAULT_RATES[role]||{};if(role==='cocinero'){if(weekend)return Number(r.weekend??45000);if(friday||holiday)return Number(r.fridayHoliday??40000);return Number(r.weekday??35000)}if(role==='mesero')return weekend||friday?Number(r.fridayHoliday??35000):Number(r.weekday??30000);if(role==='domiciliario')return weekend?Number(r.weekend??40000):Number(r.weekday??30000);return Number(r.all??0)}
function personFixed(p){let n=(p.n||'').trim().toLowerCase();if(n==='tachu')return Number(S.fixedPay?.tachu??600000);if(n==='sepúlveda'||n==='sepulveda')return Number(S.fixedPay?.sepulveda??400000);return Number(S.fixedPay?.[p.id]||0)}
function payroll(){let s=active();if(!s)return '<h1>Nómina</h1><p class="muted">Primero crea el horario.</p>';let all=S.people.map(p=>{let shifts=s.days.filter(d=>s.turns[p.id]?.[d]).map(d=>({date:d,amount:rateFor(p,d),holiday:!!s.holidays?.[d]})),fixed=personFixed(p);return {p,shifts,fixed,total:fixed+shifts.reduce((a,x)=>a+x.amount,0)}}),total=all.reduce((a,x)=>a+x.total,0);return '<h1>Nómina de quincena</h1><p class="muted">'+fmt(s.start)+' – '+fmt(s.end)+'</p><div class="panel"><h2>Tarifas editables</h2><p class="hint">Ajusta las tarifas; la nómina se recalcula con los turnos marcados.</p>'+rateEditor()+'</div><div class="panel"><h2>Roles del equipo</h2>'+S.people.map(p=>'<div class="row" style="margin:8px 0"><b>'+esc(p.n)+'</b><select style="max-width:180px" onchange="setRole(\''+p.id+'\',this.value)">'+ROLE_OPTIONS.map(([v,l])=>'<option value="'+v+'" '+((p.role||inferRole(p))===v?'selected':'')+'>'+l+'</option>').join('')+'</select><label class="hint"><input style="width:16px" type="checkbox" '+(S.rateOverrides?.[p.id]!=null?'checked':'')+' onchange="toggleOwnRate(\''+p.id+'\',this.checked)"> Tarifa propia</label>'+(S.rateOverrides?.[p.id]!=null?'<input style="max-width:115px" type="number" value="'+S.rateOverrides[p.id]+'" onchange="setOwnRate(\''+p.id+'\',this.value)">':'')+'</div>').join('')+'</div><div class="panel"><h2>Detalle por persona</h2>'+all.map(x=>'<div class="panel" style="margin:9px 0"><div class="row"><b>'+esc(x.p.n)+'</b><b>'+cash(x.total)+'</b></div><p class="hint">'+x.shifts.length+' días trabajados</p>'+x.shifts.map(t=>'<div class="row hint"><span>'+fmt(t.date)+' · '+day(t.date)+(t.holiday?' · FESTIVO':'')+'</span><b>'+cash(t.amount)+'</b></div>').join('')+(x.fixed?'<div class="row"><span class="hint">Fijo quincenal</span><b>'+cash(x.fixed)+'</b></div>':'')+'</div>').join('')+'<hr><div class="row"><h2>Total nómina</h2><h2>'+cash(total)+'</h2></div></div>'}
function rateEditor(){let r=S.payRates||{},fields=[['cocinero','weekday','Cocinero · lunes a jueves',35000],['cocinero','fridayHoliday','Cocinero · viernes y festivos',40000],['cocinero','weekend','Cocinero · sábado y domingo',45000],['mesero','weekday','Mesero · lunes a jueves',30000],['mesero','fridayHoliday','Mesero · viernes a domingo',35000],['domiciliario','weekday','Domiciliario · lunes a viernes',30000],['domiciliario','weekend','Domiciliario · sábado y domingo',40000],['barista','all','Barista · turno',25000],['stiwar','all','Stiwar · turno',40000],['pabloWeekend','all','Pablo · viernes a domingo (cajero)',40000]];return '<div class="grid">'+fields.map(([role,key,label,def])=>'<label class="field"><span>'+label+'</span><input type="number" value="'+(role==='pabloWeekend'?(S.payRates?.pabloWeekend??def):(r[role]?.[key]??def))+'" onchange="editRate(\''+role+'\',\''+key+'\',this.value)"></label>').join('')+'</div><div class="grid"><label class="field">Tachu · fijo quincenal<input type="number" value="'+(S.fixedPay?.tachu??600000)+'" onchange="editFixed(\'tachu\',this.value)"></label><label class="field">Sepúlveda · fijo quincenal<input type="number" value="'+(S.fixedPay?.sepulveda??400000)+'" onchange="editFixed(\'sepulveda\',this.value)"></label></div><p class="hint">Sepúlveda suma su fijo y sus turnos como cocinero. Stiwar tiene tarifa propia de $40.000 por turno.</p>'}
window.editRate=(role,key,v)=>{S.payRates||={};if(role==='pabloWeekend')S.payRates.pabloWeekend=Number(v)||0;else{S.payRates[role]||={};S.payRates[role][key]=Number(v)||0}save();render()};window.editFixed=(k,v)=>{S.fixedPay||={};S.fixedPay[k]=Number(v)||0;save();render()};window.setRole=(p,v)=>{let x=S.people.find(x=>x.id===p);if(x){x.role=v;save();render()}};window.toggleOwnRate=(p,v)=>{S.rateOverrides||={};if(v)S.rateOverrides[p]=rateFor(S.people.find(x=>x.id===p),active().days[0]);else delete S.rateOverrides[p];save();render()};window.setOwnRate=(p,v)=>{S.rateOverrides||={};S.rateOverrides[p]=Number(v)||0;save();render()};
function close(){let s=active();if(!s)return '<h1>Cierre</h1><p class="muted">Primero crea el horario.</p>';let n=S.people.reduce((a,p)=>a+s.days.filter(d=>s.turns[p.id]?.[d]).length*(S.rates[p.id]||0),0),c=S.closes.find(x=>x.sid===s.id)||{};return '<h1>Cierre de quincena</h1><div class="panel"><label class="field">Ventas / ingresos<input id="rev" type="number" value="'+(c.rev||'')+'"></label><div class="stat">Nómina calculada <b>'+cash(n)+'</b></div><h2>Otros pagos</h2><div id="extras">'+(c.extras||[]).map(x=>'<div class="row"><input placeholder="Concepto" value="'+esc(x.name)+'"><input type="number" placeholder="Valor" value="'+x.val+'"><label><input type="checkbox" '+(x.paid?'checked':'')+'> Pagado</label></div>').join('')+'</div><button class="btn secondary" onclick="extra()">+ Pago</button><label class="field">Retiro Camila<input id="take" type="number" value="'+(c.take||'')+'"></label><button class="btn" onclick="saveClose()">Guardar cierre</button><button class="btn" onclick="finishClose()">Cerrar quincena</button></div>'+(c.rev?'<div class="panel"><h2>Resumen</h2>Ingresos '+cash(c.rev)+' · Nómina '+cash(n)+' · Retiro '+cash(c.take)+'<h2>Queda '+cash(c.rev-n-(c.extras||[]).reduce((a,x)=>a+x.val,0)-c.take)+'</h2></div>':'')}
window.extra=()=>document.getElementById('extras').insertAdjacentHTML('beforeend','<div class="row"><input placeholder="Concepto"><input type="number" placeholder="Valor"><label><input type="checkbox"> Pagado</label></div>');window.saveClose=()=>{let s=active(),n=S.people.reduce((a,p)=>a+s.days.filter(d=>s.turns[p.id]?.[d]).length*(S.rates[p.id]||0),0),extras=[...document.querySelectorAll('#extras .row')].map(r=>({name:r.querySelectorAll('input')[0].value,val:Number(r.querySelectorAll('input')[1].value)||0,paid:r.querySelectorAll('input')[2].checked})),c={sid:s.id,rev:Number(document.getElementById('rev').value)||0,n,extras,take:Number(document.getElementById('take').value)||0,closed:false},i=S.closes.findIndex(x=>x.sid===s.id);if(i<0)S.closes.push(c);else S.closes[i]=c;save();toast('Cierre guardado')};window.finishClose=()=>{let c=S.closes.find(x=>x.sid===active().id);if(c){c.closed=true;save();toast('Quincena cerrada')}};function history(){return '<h1>Historial</h1>'+(S.closes.map(c=>'<div class="panel">'+cash(c.rev)+' ingresos · Nómina '+cash(c.n)+' · '+(c.closed?'Cerrada':'Borrador')+'</div>').join('')||'<div class="panel">Sin cierres todavía.</div>')}
function shopping(){let done=S.list.filter(x=>x.done).length;return '<h1>Lista de compras</h1><div class="panel"><h2>Pegar texto de WhatsApp</h2><textarea id="paste" placeholder="Un producto por renglón..."></textarea><button class="btn" onclick="parse()">Convertir en lista</button></div><div class="panel"><div class="row"><h2 style="flex:1">Compras</h2><button class="btn secondary" onclick="newList()">Nueva</button><button class="btn danger" onclick="clearList()">Borrar</button></div><p class="muted">'+(S.list.length-done)+' pendientes · '+done+' comprados</p>'+(S.list.map(x=>'<div class="item '+(x.done?'done':'')+'"><input type="checkbox" '+(x.done?'checked':'')+' onchange="check(\''+x.id+'\',this.checked)"><span style="flex:1">'+esc(x.name)+'</span><button class="btn danger" onclick="del(\''+x.id+'\')">×</button></div>').join('')||'<p class="muted">Pega la lista para comenzar.</p>')+'<button class="btn secondary" onclick="addItem()">+ Producto</button></div>'}
window.parse=()=>{let a=document.getElementById('paste').value.split(/\r?\n/).map(x=>x.replace(/^\s*(?:[-•*]|\d+[.)])\s*/,'').trim()).filter(Boolean);if(!a.length)return toast('Pega productos');S.list=a.map(name=>({id:id(),name,done:false}));save();render()};window.check=(i,v)=>{S.list.find(x=>x.id===i).done=v;save();render()};window.del=i=>{S.list=S.list.filter(x=>x.id!==i);save();render()};window.newList=()=>{if(confirm('¿Empezar una lista nueva?')){S.list=[];save();render()}};window.clearList=()=>{if(confirm('¿Borrar toda la lista?')){S.list=[];save();render()}};window.addItem=()=>{let n=prompt('Producto');if(n){S.list.push({id:id(),name:n,done:false});save();render()}};render();
})();
</script><script>if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));</script></body></html>
