name: Validate TOQUIN APP
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check frontend JavaScript syntax
        run: |
          node --check toquin-recipes.js
          npx --yes deno check supabase/functions/toquin-recipes/index.ts
          node --check app-auth.js
          node --check config.js
          node --check sw.js
          sed -n '/<script>/,/<\/script>/p' index.html | sed '1d;$d' > /tmp/legacy.js
          node --check /tmp/legacy.js
